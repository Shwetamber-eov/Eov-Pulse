services:
  chromadb:
    image: chromadb/chroma:${CHROMA_VERSION:-latest}
    container_name: chroma-server
    volumes:
      - ./chroma_data/chroma:/chroma
      - ./config.yaml:/config.yaml
    ports:
      - "8001:8000"
    environment:
      - CHROMA_CONFIG_PATH=/config.yaml
    restart: always
    networks:
      - clinical-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_NUM_THREADS=4
      - OLLAMA_KEEP_ALIVE=60m
    restart: unless-stopped
    networks:
      - clinical-net

  ingestor:
    build: .
    container_name: rag-ingestor
    volumes:
      - ./data:/app/data
    command: ["python", "app/rag/ingest_csv.py"]
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_URL=http://ollama:11434
      - PYTHONPATH=/app
    depends_on:
      chromadb:
        condition: service_started
    networks:
      - clinical-net

  app-server:
    build: .
    container_name: clinical-app-server
    ports:
      - "8080:8000"   # http://localhost:8080 serves both API and index.html
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_URL=http://ollama:11434
      - PYTHONPATH=/app
    depends_on:
      ingestor:
        condition: service_completed_successfully
    command: ["uvicorn", "backend_api:app", "--app-dir", "updated_ui", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - clinical-net

networks:
  clinical-net:
    driver: bridge